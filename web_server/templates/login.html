<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unlock LED media library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='web_ui.css') }}">
  <script src="{{ url_for('static', filename='login.js') }}" defer></script>
</head>
<body>
  <main class="locked-page">
    <div class="eyebrow"><span class="indicator"></span> 20 × 15 LED MATRIX</div>
    <h1>Midnight Machines: LED Matrix</h1>
    <p class="intro">Unlock your media library to manage the matrix.</p>
  </main>
  <dialog id="login-dialog" aria-labelledby="login-heading" aria-describedby="login-description" open>
    <h2 id="login-heading">Enter password</h2>
    <p id="login-description" class="hint">Unlock the LED media manager.</p>
    <form id="password-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             aria-describedby="login-error" required autofocus>
      <p id="login-error" class="login-error" role="alert">{{ error or '' }}</p>
      <div class="dialog-actions"><button type="submit">Unlock</button></div>
    </form>
  </dialog>
</body>
</html>
